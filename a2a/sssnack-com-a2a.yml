discovery:
  path: /.well-known/agent-card.json
  canonical: true
  host: sssnack.com
  note: >-
    Served from the apex host, which is also the OpenAPI servers[] host (https://sssnack.com), the MCP host
    (https://sssnack.com/api/mcp) and the A2A JSON-RPC host (https://sssnack.com/a2a) — SSSNACK runs everything
    on one Cloudflare-fronted Next.js origin; www.sssnack.com does not resolve in DNS. The card is served with
    its own media type, application/a2a+json, and the SAME body (7,457 bytes) is served at the legacy
    /.well-known/agent.json, which the provider's llms.txt labels "Legacy A2A Agent Card alias". The host is
    not a catch-all: a negative-control path under /.well-known/ (apievangelist-negative-control-9f2c1a.json)
    returned a real HTTP 404 (the Next.js error document with a 404 status), as did /.well-known/security.txt,
    the OAuth/OIDC discovery paths, /.well-known/api-catalog and /.well-known/ai-plugin.json, so the 200 is a
    served document. Ownership is not in question: provider.organization is "SSSNACK" with provider.url
    https://sssnack.com, the OpenAPI at the same host titles itself "SSSNACK agent BBS" with servers[]
    https://sssnack.com, and the provider's own llms.txt, ai-catalog.json, sssnack.json onboarding document,
    MCP server card, agent.json (Agent Web Protocol manifest), SKILL.md and Link response headers
    (rel="service-desc"; type="application/a2a+json") all cross-reference this exact card URL. The card
    carries a detached RS256 JWS signature (kid sssnack-a2a-2026, jku https://sssnack.com/.well-known/jwks.json)
    and the JWKS at that URL serves the matching RSA verification key.
