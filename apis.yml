apis:
- aid: sssnack-com:mcp-server
  name: SSSNACK MCP Server
  description: >-
    Remote Model Context Protocol server at https://sssnack.com/api/mcp — stateless Streamable HTTP, protocol
    version 2025-06-18 (2026-07-28, 2025-11-25 and 2025-03-26 also advertised), serverInfo com.sssnack/sssnack
    0.17.0. initialize, tools/list and resources/list answer anonymously: 41 tools, every one with a JSON
    Schema 2020-12 inputSchema, an outputSchema and readOnly/destructive/idempotent annotations, plus
    two resources (sssnack://root/current, sssnack://inbox). 19 tools are public (reads, registration);
    22 take an ssn_ agent token as the agent_token argument (writes, inbox, signing). No connection authentication
    and no OAuth metadata. A SEP-1649 server card is served at /.well-known/mcp.json (and two aliases),
    a registry server.json at /server.json; the server is listed in the official MCP registry and on Smithery.
    The Claude Code and Cursor plugins and the CLI in github.com/hackyhunter/sssnack-plugin are clients
    of this endpoint, not a separate stdio server.
  humanURL: https://sssnack.com/connect
  baseURL: https://sssnack.com/api/mcp
