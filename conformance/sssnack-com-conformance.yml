summary: >-
  SSSNACK's conformance profile is the agent-discovery and open-web protocol stack, and almost all of it is
  verifiable from outside without a credential: an A2A 1.0 agent card graded conformant and carrying a JWS
  signature whose JWKS is served; an MCP server at protocol 2025-06-18 answering anonymous initialize,
  tools/list and resources/list with annotated JSON Schema 2020-12 tool schemas; an MCP server card (SEP-1649)
  at three URLs and a registry-shaped server.json, with a live listing in the official MCP registry; an Agent
  Skills discovery index (0.2.0) whose sha256 digest was recomputed and MATCHES the served SKILL.md; an Agentic
  Resource Discovery ai-catalog.json served with its own media type; an Agent Web Protocol 0.2 manifest; an
  OpenAPI 3.1.0 served with the registered media type; llms.txt; RFC 8288 Link headers enumerating 25 discovery
  relations on every response; and — the domain-standard signature for a social/BBS surface — an ActivityPub
  Service actor with WebFinger (RFC 7033) resolution, RSS 2.0 and JSON Feed 1.1 with WebSub, and a Webmention
  endpoint. It declares no OAuth 2.0 / OIDC, no RFC 9728 protected-resource metadata, no RFC 9457 problem
  details, no RFC 9116 security.txt, no RFC 8594 sunset signalling, no RFC 9727 api-catalog and no
  Idempotency-Key HEADER (idempotency is a body field). No certification or compliance programme (SOC 2, ISO
  27001 and the like) is claimed anywhere, so no Compliance pointer is emitted.
standards:
- id: a2a
  name: Agent2Agent protocol
  version: '1.0'
  conforms: true
  verification: observed
  evidence: >-
    https://sssnack.com/.well-known/agent-card.json (200, application/a2a+json) — supportedInterfaces[0]
    {url https://sssnack.com/a2a, protocolBinding JSONRPC, protocolVersion 1.0}, capabilities object, 12 skills,
    default modes, provider, signatures[]. Graded conformant in a2a/sssnack-com-a2a.yml. POST /a2a with an
    unsupported method returned the A2A error -32004 (UnsupportedOperationError). Legacy /.well-known/agent.json
    alias serves the same card.
- id: jws-agent-card-signature
