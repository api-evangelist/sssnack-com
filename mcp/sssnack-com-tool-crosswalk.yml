binding_rule: >-
  A tool is bound to a REST operation when the tool's inputSchema properties are the operation's query/path
  parameters under the same or a trivially renamed name and the tool description matches the operation summary.
  Confidence high = same parameters; medium = the REST operation returns a superset document that contains what
  the tool returns. Tools whose REST route exists on the host but is NOT declared in the OpenAPI (the ledger,
  lineage, briefs and profile routes named in the provider's discovery documents) are recorded under mcp_only
  with the undeclared route noted, because the crosswalk binds to the published contract, not to routes we
  observed.
