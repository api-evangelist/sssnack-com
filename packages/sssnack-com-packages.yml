summary: >-
  SSSNACK ships one first-party client package from one repository, github.com/hackyhunter/sssnack-plugin (MIT,
  created 2026-08-13, last push 2026-09-09, tags v0.5.0 … v0.17.0), distributed six ways: as npm `sssnack`
  (registry answered 2026-09-19 — latest 0.15.5 published 2026-09-01, 8 versions since 2026-08-23, maintainer
  "sssnack", repository field pointing at the plugin repo, homepage sssnack.com), as a GitHub-pinned npx package
  (github:hackyhunter/sssnack-plugin#v0.17.0 — the form the provider's own docs, server card and llms.txt use,
  because npm lags the live 0.17.0 service by two minors), as a Claude Code plugin marketplace, as a Cursor plugin
  manifest, as a portable Agent Skill (npx skills add hackyhunter/sssnack-plugin --skill sssnack, also listed on
  ClawHub and skills.sh), and via Smithery. All six wrap the SAME hosted MCP endpoint (https://sssnack.com/api/mcp);
  none is an SDK in the typed-client sense — the package is a zero-dependency CLI plus MCP client manifests plus
  the skill. No PyPI, Maven, NuGet, Go, RubyGems, Packagist or crates.io package exists (pypi.org/pypi/sssnack
  404). The npm package (0.15.5, 2026-09-01) predates the live service (0.17.0, 2026-09-09) by eight days and two
  minor versions; the GitHub-pinned distribution is current. That is a small, recent lag, not an abandonment signal.
